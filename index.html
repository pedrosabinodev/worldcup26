<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-8S4FGDNJVP"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-8S4FGDNJVP');

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 26 — Do You Know The Players?</title>
<meta name="description" content="Guess which country each World Cup 2026 player represents. A football trivia game for FIFA World Cup 2026.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="main">

  <header>
    <div class="logo" data-action="home">WORLD CUP <span>26</span></div>
    <button id="lang-toggle" data-action="toggle-lang" data-lang="en" aria-label="Switch language">
      <span class="lt-en">EN</span>
      <span style="opacity:.3">|</span>
      <span class="lt-pt">PT</span>
    </button>
    <div class="score-row" id="hud">
      <div class="score-item"><div class="score-label" data-i18n="score">Score</div><div class="score-val" id="score">0</div></div>
      <div class="score-item"><div class="score-label" data-i18n="streak">Streak</div><div class="score-val streak-val" id="streak">0</div></div>
      <div class="score-item"><div class="score-label" data-i18n="round">Round</div><div class="score-val" id="round-display">1/10</div></div>
    </div>
  </header>

  <div class="diff-breadcrumb" id="diff-breadcrumb" data-action="home">
    <span class="diff-breadcrumb-arrow">←</span>
    <span class="diff-breadcrumb-label" data-i18n="difficulty">Difficulty</span>
    <span class="diff-breadcrumb-sep">/</span>
    <span class="diff-breadcrumb-value" id="diff-breadcrumb-value"></span>
  </div>

  <!-- WELCOME SCREEN -->
  <div id="welcome-screen" class="screen">
    <div class="welcome-eyebrow" data-i18n="eyebrow">FIFA World Cup 2026</div>
    <div class="welcome-title" data-i18n-html="title">Do you know<br>the <span>players?</span></div>
    <div class="welcome-sub" data-i18n="intro"></div>
    <div class="mode-label" data-i18n="chooseMode"></div>
    <div class="mode-cards">
      <button class="mode-card" data-action="start" data-mode="stars">
        <div class="mode-card-icon">⭐</div>
        <div class="mode-card-title" data-i18n="mode.stars"></div>
        <div class="mode-card-desc" data-i18n="modeDesc.stars"></div>
      </button>
      <button class="mode-card" data-action="start" data-mode="mixed">
        <div class="mode-card-icon">🔥</div>
        <div class="mode-card-title" data-i18n="mode.mixed"></div>
        <div class="mode-card-desc" data-i18n="modeDesc.mixed"></div>
      </button>
      <button class="mode-card" data-action="start" data-mode="all">
        <div class="mode-card-icon">🌍</div>
        <div class="mode-card-title" data-i18n="mode.all"></div>
        <div class="mode-card-desc" data-i18n="modeDesc.all"></div>
      </button>
    </div>
    <div class="creator-sign" data-i18n="creator">by Pedro Sabino</div>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen" class="screen">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="q-counter" id="q-counter"></div>
    <div class="player-card" id="player-card"></div>
    <div class="question-label" id="q-label" data-i18n="question">Which country does this player represent?</div>
    <div class="options-grid" id="options-grid"></div>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="results-screen" class="screen">
    <div class="results-label" data-i18n="finalScore">Final score</div>
    <div class="results-score" id="results-score">0</div>
    <div class="results-sub" id="results-sub"></div>
    <div class="results-btn-row">
      <button class="play-again" data-action="replay" data-i18n="playAgain">Play Again</button>
      <button class="change-mode" data-action="home" data-i18n="changeMode">Change Difficulty</button>
    </div>
    <div class="match-review">
      <div class="review-header">
        <span class="review-label" data-i18n="review">MATCH REVIEW</span>
        <button class="share-btn" data-action="share-open" data-i18n="shareReview">SHARE REVIEW</button>
      </div>
      <div class="review-divider"></div>
      <div id="review-list"></div>
    </div>
  </div>

  <!-- SHARE MODAL -->
  <div class="share-modal" id="share-modal" data-action="share-backdrop">
    <div class="share-modal-card">
      <div class="share-modal-header">
        <span class="share-modal-title" data-i18n="shareTitle">Share your match</span>
        <button class="share-modal-x" data-action="share-close" aria-label="Close">✕</button>
      </div>
      <div class="share-text-block" id="share-text-block"></div>
      <div class="share-actions">
        <button class="copy-share-btn" id="copy-share-btn" data-action="share-copy">
          <svg width="16" height="16" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><path d="M11.5 0H3.5a.5.5 0 00-.5.5V3H.5a.5.5 0 00-.5.5v8a.5.5 0 00.5.5h8a.5.5 0 00.5-.5V9h2.5a.5.5 0 00.5-.5V.5A.5.5 0 0011.5 0zM8 11H1V4h7v7zm3-3H9V3.5A.5.5 0 008.5 3H4V1h7v7z"/></svg>
          <span id="copy-share-label" data-i18n="copyShare">COPY &amp; SHARE</span>
        </button>
        <button class="modal-close-btn" data-action="share-close" data-i18n="close">Close</button>
      </div>
    </div>
  </div>

</div>

<script src="js/data/players.js"></script>
<script src="js/data/clubs.js"></script>
<script src="js/data/worldcup.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
